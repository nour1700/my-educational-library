<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبتي التعليمية</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #101827;
  color: white;
}

header {
  padding: 20px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #182538;
  border-bottom: 1px solid #34445b;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  color: #f5c542;
}

button {
  border: 0;
  padding: 12px 17px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
}

  lastTouch = Date.now();

  const touch = event.touches[0];
  if (!touch) return;

  glow.style.left = touch.clientX + "px";
  glow.style.top = touch.clientY + "px";
  glow.style.opacity = 1;

  if (
    lastX === null ||
    Math.hypot(touch.clientX - lastX, touch.clientY - lastY) > 14
  ) {
    addTrail(touch.clientX, touch.clientY);
    lastX = touch.clientX;
    lastY = touch.clientY;
  }
}

function endTouch(event) {
  lastTouch = Date.now();

  if (event.touches.length > 0) return;

  glow.style.opacity = 0;
  lastX = null;
  lastY = null;
}

document.addEventListener("touchstart", touchGlow, { passive: true });
document.addEventListener("touchmove", touchGlow, { passive: true });
document.addEventListener("touchend", endTouch);
document.addEventListener("touchcancel", endTouch);

// تشغيل الموقع
render();
</script>

</body>
</html>
